# !! MOST OF THIS FILE IS NOT THIS APPLICATION.
#
# The `coolms/*` packages register almost none of their own services. They
# alias interfaces to concrete classes and leave the registration of those
# classes to the consumer -- so every application that installs them must
# carry the block below, EXCLUSIONS INCLUDED, or the container does not
# compile. It was copied out of the CoolMS application tree, which is the
# only place it exists.
#
# Each exclusion is load-bearing and none of them is guessable. See
# docs/what-the-skeleton-cannot-ship.md.

services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            # coolms/core-bundle ships console commands that take a plain
            # `string $projectDir`. Autowiring cannot fill a scalar, so
            # without this the container fails on RemoveModuleCommand.
            # One more thing the packages leave to the consumer.
            string $projectDir: '%kernel.project_dir%'

    # coolms/rql ships three pure library classes -- one id each.
    CoolMS\Rql\RqlParser: ~
    CoolMS\Rql\RqlExpressionParser: ~
    CoolMS\Rql\RqlMemoryFilter: ~

    CoolMS\Core\:
        resource: '%kernel.project_dir%/vendor/coolms/core/src/'
        exclude:
            - '%kernel.project_dir%/vendor/coolms/core/src/Model/'
            - '%kernel.project_dir%/vendor/coolms/core/src/ValueObject/'
            - '%kernel.project_dir%/vendor/coolms/core/src/Config/'
            - '%kernel.project_dir%/vendor/coolms/core/src/Registry/'
            - '%kernel.project_dir%/vendor/coolms/core/src/Identity/EntityWalkUserGroupResolver.php'

    # The composition tier is wired but no longer REQUIRED by this manifest: it
    # arrives transitively, because the published core-bundle requires it by
    # name. Removing the requirement did not remove the package, and the wiring
    # has to name what an install actually contains.
    #
    # Which name that is has changed twice, and getting it wrong is expensive:
    # `coolms/core-app` was an intermediate spelling never published at all, and
    # pointing at it made `cache:clear` fail during `composer install` -- three
    # steps before anything that checks a manifest, so the whole documented
    # install stopped at step 3 and every later assertion was skipped rather
    # than run. The published name is `coolms/core-application`; the older
    # `coolms/core-module` is abandoned and points at it.
    CoolMS\Core\Application\:
        resource: '%kernel.project_dir%/vendor/coolms/core-application/src/'
        exclude:
            - '%kernel.project_dir%/vendor/coolms/core-application/src/Config/ChainedConfigWriter.php'

    CoolMS\Core\Doctrine\:
        resource: '%kernel.project_dir%/vendor/coolms/core-doctrine/src/'
        exclude:
            - '%kernel.project_dir%/vendor/coolms/core-doctrine/src/mapping/'

    CoolMS\Core\Bundle\:
        resource: '%kernel.project_dir%/vendor/coolms/core-bundle/src/'
        exclude:
            - '%kernel.project_dir%/vendor/coolms/core-bundle/src/CoreBundle.php'
            - '%kernel.project_dir%/vendor/coolms/core-bundle/src/AbstractCoolmsBundle.php'
            - '%kernel.project_dir%/vendor/coolms/core-bundle/src/DependencyInjection/'

    CoolMS\Entity\:
        resource: '%kernel.project_dir%/vendor/coolms/entity/src/'
        exclude:
            - '%kernel.project_dir%/vendor/coolms/entity/src/ValueObject/'

    # Same as the core tier above: required by the published entity-bundle, not
    # by this manifest. `coolms/entity-module` is abandoned in favour of the
    # name below.
    CoolMS\Entity\Application\:
        resource: '%kernel.project_dir%/vendor/coolms/entity-application/src/'

    CoolMS\Entity\Doctrine\:
        resource: '%kernel.project_dir%/vendor/coolms/entity-doctrine/src/'
        exclude:
            - '%kernel.project_dir%/vendor/coolms/entity-doctrine/src/Tree/'

    CoolMS\Entity\Bundle\:
        resource: '%kernel.project_dir%/vendor/coolms/entity-bundle/src/'
        exclude:
            - '%kernel.project_dir%/vendor/coolms/entity-bundle/src/EntityBundle.php'
            - '%kernel.project_dir%/vendor/coolms/entity-bundle/src/DependencyInjection/'
            - '%kernel.project_dir%/vendor/coolms/entity-bundle/src/Factory/'

    # This application: nothing yet.
    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'
